name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check Bash syntax
        run: bash -n scripts/install-pegasus.sh

      - name: Parse Python scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in sorted(Path("scripts").glob("*.py")):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck

      - name: Check shell scripts
        run: shellcheck --severity=warning --format=gcc scripts/*.sh

  python-analysis:
    name: Python security and unused-code checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install pinned analysis tools
        run: |
          python3 -m venv "$RUNNER_TEMP/analysis-venv"
          "$RUNNER_TEMP/analysis-venv/bin/python" -m pip install --disable-pip-version-check --requirement requirements-ci.txt

      - name: Check for unused Python code
        run: |
          "$RUNNER_TEMP/analysis-venv/bin/ruff" check --select F scripts

      - name: Scan Python for security issues
        run: |
          "$RUNNER_TEMP/analysis-venv/bin/bandit" --recursive --severity-level low --confidence-level low scripts

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"

      - name: Scan changed files for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          base_sha="$BASE_SHA"
          if [ -z "$base_sha" ] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi
          changed_files="$RUNNER_TEMP/gitleaks-changed-files"
          if ! git diff --name-only --diff-filter=ACMRT -z "$base_sha...HEAD" > "$changed_files"; then
            echo "Could not determine files changed since the base commit." >&2
            exit 1
          fi
          while IFS= read -r -d '' path; do
            if [ -f "$path" ]; then
              "$RUNNER_TEMP/gitleaks" dir --redact --exit-code 1 "$path"
            fi
          done < "$changed_files"

  workflow-analysis:
    name: GitHub Actions security checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install pinned actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          chmod 0755 "$RUNNER_TEMP/actionlint"

      - name: Check workflow syntax
        run: |
          "$RUNNER_TEMP/actionlint" -color

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd
        with:
          version: v1.32.0
          online-audits: false
          advanced-security: false
          annotations: true
          min-severity: low
          min-confidence: low
